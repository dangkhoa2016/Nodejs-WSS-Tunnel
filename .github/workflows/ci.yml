name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build:client
      - name: Verify bundle is standalone
        run: |
          SANDBOX=$(mktemp -d)
          cp dist/client.js "$SANDBOX/"
          cd "$SANDBOX"
          echo '{"type":"module","dependencies":{"ws":"^8.21.1"}}' > package.json
          npm install --silent
          node --check client.js
          node -e "import('./client.js').catch(e => console.log('OK:', e.message))" 2>&1 | grep 'TUNNEL_SERVER_URL'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tunnel
          POSTGRES_PASSWORD: tunnel
          POSTGRES_DB: tunnel
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U tunnel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_TCP_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - run: NODE_ENV=test node --test --test-timeout=120000 test/*.test.js

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Check dependencies for known advisories
        run: yarn npm audit --all

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tunnel-server .
      - name: Start container and verify health
        run: |
          docker run --rm -d -p 7860:7860 \
            -e TUNNEL_USERNAME=admin \
            -e TUNNEL_PASSWORD=secret \
            -e SERVER_HOST=http://127.0.0.1:7860 \
            --name tunnel-server-test \
            tunnel-server
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7860/__health > /dev/null 2>&1; then
              echo "Container ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/__health | grep -q ok || exit 1
      - name: Verify artifact routes served from container
        run: |
          curl -sf http://127.0.0.1:7860/client.js -o /tmp/client.js
          node --check /tmp/client.js
          curl -sf http://127.0.0.1:7860/client-package.json | grep -q 'tunnel-client'
      - name: Run installer and verify upgrade + tunneled requests
        run: |
          WORK_DIR=$(mktemp -d)

          # Start a dummy origin for tunneled requests
          node -e "
            const http = require('http');
            http.createServer((req, res) => {
              res.writeHead(200, {'Content-Type':'text/plain'});
              res.end('proxied:' + req.url);
            }).listen(8080, () => console.log('origin ready on 8080'));
          " &
          ORIGIN_PID=$!

          # First install
          HOME="$WORK_DIR" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          FIRST_PID=$(cat "$WORK_DIR/.tunnel-client/current/pid" 2>/dev/null || echo "none")
          echo "First install PID: $FIRST_PID"

          # Tunneled request through first install
          sleep 2
          CURL_OUT=$(curl -sf http://127.0.0.1:7860/hello-proxy 2>&1 || echo "FAILED")
          echo "First proxy response: $CURL_OUT"
          if [ "$CURL_OUT" != "proxied:/hello-proxy" ]; then
            echo "ERROR: tunneled request did not reach origin"
            exit 1
          fi

          # Second install (upgrade)
          HOME="$WORK_DIR" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          SECOND_PID=$(cat "$WORK_DIR/.tunnel-client/current/pid" 2>/dev/null || echo "none")
          echo "Second install PID: $SECOND_PID"

          # Verify upgrade: PID changed
          if [ "$FIRST_PID" = "none" ] || [ "$SECOND_PID" = "none" ]; then
            echo "ERROR: PID file missing"
            exit 1
          fi
          if [ "$FIRST_PID" = "$SECOND_PID" ]; then
            echo "ERROR: PID did not change after upgrade"
            exit 1
          fi

          # Verify previous release exists and matches first release
          if [ ! -d "$WORK_DIR/.tunnel-client/previous" ]; then
            echo "ERROR: previous symlink missing after upgrade"
            exit 1
          fi
          PREV_PID=$(cat "$WORK_DIR/.tunnel-client/previous/pid" 2>/dev/null || echo "none")
          if [ "$PREV_PID" != "$FIRST_PID" ]; then
            echo "ERROR: previous release does not match first install (prev=$PREV_PID first=$FIRST_PID)"
            exit 1
          fi

          # Verify new PID is alive
          kill -0 "$SECOND_PID" 2>/dev/null || {
            echo "ERROR: new client PID $SECOND_PID not running"
            exit 1
          }

          # Tunneled request through upgraded install
          sleep 2
          CURL_OUT2=$(curl -sf http://127.0.0.1:7860/upgrade-test 2>&1 || echo "FAILED")
          echo "Second proxy response: $CURL_OUT2"
          if [ "$CURL_OUT2" != "proxied:/upgrade-test" ]; then
            echo "ERROR: tunneled request failed after upgrade"
            exit 1
          fi

          # Cleanup origin server
          kill "$ORIGIN_PID" 2>/dev/null || true

          echo "All upgrade checks passed"
      - name: Stop container
        if: always()
        run: docker stop tunnel-server-test || true

  installer:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - name: Start server
        run: |
          TUNNEL_USERNAME=admin TUNNEL_PASSWORD=secret \
          INSTALL_UUID=ci-install \
          SERVER_HOST=http://127.0.0.1:7860 \
          node src/index.js &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server.pid
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7860/__health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:7860/__health || exit 1
      - name: Verify artifact routes
        run: |
          curl -sf http://127.0.0.1:7860/client.js -o /tmp/client.js
          node --check /tmp/client.js
          curl -sf http://127.0.0.1:7860/client-package.json -o /tmp/pkg.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('/tmp/pkg.json','utf8'));
            console.log('Manifest:', p.name);
          "
      - name: Run installer
        run: |
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          ls -la "$SANDBOX/.tunnel-client/"
      - name: Verify client connects
        run: |
          node -e "
            const { WebSocket } = require('ws');
            const ws = new WebSocket('ws://admin:secret@127.0.0.1:7860/tunnel');
            ws.on('open', () => { console.log('CLIENT CONNECTED'); ws.close(); process.exit(0); });
            ws.on('error', (e) => { console.error('CONNECT ERROR:', e.message); process.exit(1); });
            setTimeout(() => { console.error('TIMEOUT'); process.exit(1); }, 5000);
          "
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
