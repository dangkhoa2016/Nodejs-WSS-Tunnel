name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build:client
      - name: Verify bundle is standalone
        run: |
          SANDBOX=$(mktemp -d)
          cp dist/client.js "$SANDBOX/"
          cd "$SANDBOX"
          echo '{"type":"module","dependencies":{"ws":"^8.21.1"}}' > package.json
          npm install --silent
          node --check client.js
          node -e "import('./client.js').catch(e => console.log('OK:', e.message))" 2>&1 | grep 'TUNNEL_SERVER_URL'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tunnel
          POSTGRES_PASSWORD: tunnel
          POSTGRES_DB: tunnel
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U tunnel" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - run: NODE_ENV=test node --test --test-timeout=120000 test/*.test.js

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Check dependencies for known advisories
        run: yarn npm audit --all

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - name: Start server with deterministic UUID
        run: |
          TUNNEL_USERNAME=admin TUNNEL_PASSWORD=secret \
          INSTALL_UUID=ci-install \
          SERVER_HOST=http://127.0.0.1:7860 \
          node src/index.js &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server.pid
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7860/__health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:7860/__health || exit 1
      - name: Test artifact routes
        run: |
          curl -sf http://127.0.0.1:7860/client.js -o /tmp/client.js
          node --check /tmp/client.js
          curl -sf http://127.0.0.1:7860/client-package.json -o /tmp/pkg.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('/tmp/pkg.json','utf8'));
            console.log('Manifest:', p.name);
          "
          echo "Artifacts OK"
      - name: Run installer in temp HOME
        run: |
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX" \
          TUNNEL_SERVER_URL=wss://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash -c "
              cd /tmp
              mkdir -p \$HOME
              cat serve/setup.sh | sed 's|read -rp.*</dev/tty||' > /tmp/installer.sh
              echo '' > /tmp/auto_input
              exec < /tmp/auto_input
              source /tmp/installer.sh
            " 2>&1 || true
          ls -la "$SANDBOX/.tunnel-client/" 2>/dev/null
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
