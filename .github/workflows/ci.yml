name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build:client
      - name: Verify bundle is standalone
        run: |
          SANDBOX=$(mktemp -d)
          cp dist/client.js "$SANDBOX/"
          cd "$SANDBOX"
          echo '{"type":"module","dependencies":{"ws":"^8.21.1"}}' > package.json
          npm install --silent
          node --check client.js
          node -e "import('./client.js').catch(e => console.log('OK:', e.message))" 2>&1 | grep 'TUNNEL_SERVER_URL'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tunnel
          POSTGRES_PASSWORD: tunnel
          POSTGRES_DB: tunnel
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U tunnel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_TCP_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - run: NODE_ENV=test node --test --test-timeout=120000 test/*.test.js

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Check dependencies for known advisories
        run: yarn npm audit --all

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tunnel-server .
      - name: Start container and verify health
        run: |
          docker run --rm -d -p 7860:7860 \
            -e TUNNEL_USERNAME=admin \
            -e TUNNEL_PASSWORD=secret \
            -e SERVER_HOST=http://127.0.0.1:7860 \
            --name tunnel-server-test \
            tunnel-server
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 http://127.0.0.1:7860/__health > /dev/null 2>&1; then
              echo "Container ready"
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 10 http://127.0.0.1:7860/__health | grep -q ok || exit 1
      - name: Verify artifact routes served from container
        run: |
          curl -sf --max-time 10 http://127.0.0.1:7860/client.js -o /tmp/client.js
          node --check /tmp/client.js
          curl -sf --max-time 10 http://127.0.0.1:7860/client-package.json | grep -q 'tunnel-client'
      - name: Run installer and verify upgrade + tunneled requests
        run: |
          set -euo pipefail
          CLIENT_HOME="$(mktemp -d)"
          CLIENT_DIR="${CLIENT_HOME}/.tunnel-client"
          ORIGIN_PID=""
          ARTIFACT_PROXY_PID=""
          cleanup() {
            if [ -f "${CLIENT_DIR}/client.pid" ]; then
              kill "$(cat "${CLIENT_DIR}/client.pid")" 2>/dev/null || true
            fi
            [ -n "$ORIGIN_PID" ] && kill "$ORIGIN_PID" 2>/dev/null || true
            [ -n "$ARTIFACT_PROXY_PID" ] && kill "$ARTIFACT_PROXY_PID" 2>/dev/null || true
            rm -rf "$CLIENT_HOME" || true
          }
          trap cleanup EXIT

          # Start a dummy origin for tunneled requests
          node -e "
            const http = require('http');
            http.createServer((req, res) => {
              res.writeHead(200, {'Content-Type':'text/plain'});
              res.end('proxied:' + req.url);
            }).listen(8080, () => console.log('origin ready on 8080'));
          " &
          ORIGIN_PID=$!

          # First install
          HOME="$CLIENT_HOME" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          FIRST_RELEASE="$(readlink "${CLIENT_DIR}/current")"
          FIRST_PID="$(cat "${CLIENT_DIR}/client.pid")"
          FIRST_READY="$(cat "${CLIENT_DIR}/client.ready")"
          test "$FIRST_PID" = "$FIRST_READY"
          kill -0 "$FIRST_PID"

          # Tunneled request through first install
          sleep 2
          CURL_OUT=$(curl -sf --max-time 15 http://127.0.0.1:7860/hello-proxy 2>&1 || echo "FAILED")
          echo "First proxy response: $CURL_OUT"
          if [ "$CURL_OUT" != "proxied:/hello-proxy" ]; then
            echo "ERROR: tunneled request did not reach origin"
            exit 1
          fi

          # Second install (upgrade)
          HOME="$CLIENT_HOME" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          SECOND_RELEASE="$(readlink "${CLIENT_DIR}/current")"
          SECOND_PID="$(cat "${CLIENT_DIR}/client.pid")"
          SECOND_READY="$(cat "${CLIENT_DIR}/client.ready")"
          PREVIOUS_RELEASE="$(readlink "${CLIENT_DIR}/previous")"
          test "$SECOND_RELEASE" != "$FIRST_RELEASE"
          test "$SECOND_PID" != "$FIRST_PID"
          test "$SECOND_PID" = "$SECOND_READY"
          test "$PREVIOUS_RELEASE" = "$FIRST_RELEASE"
          kill -0 "$SECOND_PID"

          # Tunneled request through upgraded install
          sleep 2
          CURL_OUT2=$(curl -sf --max-time 15 http://127.0.0.1:7860/upgrade-test 2>&1 || echo "FAILED")
          echo "Second proxy response: $CURL_OUT2"
          if [ "$CURL_OUT2" != "proxied:/upgrade-test" ]; then
            echo "ERROR: tunneled request failed after upgrade"
            exit 1
          fi

          # Rollback smoke: start an artifact proxy that serves a bad client.js
          node -e "
            const http=require('http'),net=require('net');
            http.createServer((q,r)=>{
              if(q.url==='/client.js'){r.writeHead(200,{'Content-Type':'application/javascript'});r.end('setInterval(()=>{},1000);');return}
              const o=http.request({hostname:'127.0.0.1',port:7860,path:q.url,method:q.method,headers:q.headers},p=>{r.writeHead(p.statusCode,p.headers);p.pipe(r)})
              o.on('error',()=>{r.writeHead(502);r.end()});q.pipe(o)
            }).on('upgrade',(q,sk,head)=>{
              const t=net.connect(7860,'127.0.0.1',()=>{
                t.write(q.method+' '+q.url+' HTTP/'+q.httpVersion+'\r\n')
                for(let i=0;i<q.rawHeaders.length;i+=2)t.write(q.rawHeaders[i]+': '+q.rawHeaders[i+1]+'\r\n')
                t.write('\r\n');t.write(head);t.pipe(sk);sk.pipe(t)
              })
              t.on('error',()=>sk.destroy())
            }).listen(7861)
          " &
          ARTIFACT_PROXY_PID=$!

          # Wait for proxy readiness
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 \
              http://127.0.0.1:7861/client-package.json \
              >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          curl -fsS --max-time 10 \
            http://127.0.0.1:7861/client-package.json \
            >/dev/null
          kill -0 "$ARTIFACT_PROXY_PID"

          # Third install (bad bundle, should trigger rollback)
          HOME="$CLIENT_HOME" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7861/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1 && ROLLBACK_EXIT=$? || ROLLBACK_EXIT=$?
          echo "=== Client log after third install ==="
          cat "${CLIENT_DIR}/client.log" 2>/dev/null || true
          echo "======================================="
          echo "Rollback smoke: setup.sh exit=$ROLLBACK_EXIT"
          test "$ROLLBACK_EXIT" = "0"
          ROLLED_RELEASE="$(readlink "${CLIENT_DIR}/current")"
          ROLLED_PID="$(cat "${CLIENT_DIR}/client.pid")"
          ROLLED_READY="$(cat "${CLIENT_DIR}/client.ready")"
          echo "Rollback smoke: release=$ROLLED_RELEASE pid=$ROLLED_PID ready=$ROLLED_READY"
          echo "Rollback smoke: expected release=$SECOND_RELEASE previous=$FIRST_RELEASE"
          test "$ROLLED_RELEASE" = "$SECOND_RELEASE"
          test "$ROLLED_PID" = "$ROLLED_READY"
          test "$ROLLED_PID" != "$SECOND_PID"
          kill -0 "$ROLLED_PID"

          # Verify rollback removed the failed release
          test "$(find "${CLIENT_DIR}/releases" \
            -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 2
          test "$(readlink "${CLIENT_DIR}/current")" = "$SECOND_RELEASE"
          test "$(readlink "${CLIENT_DIR}/previous")" = "$FIRST_RELEASE"

          # Tunneled request after rollback (previous client restarted and should work)
          sleep 2
          CURL_OUT3=$(curl -sf --max-time 15 http://127.0.0.1:7860/rollback-test 2>&1 || echo "FAILED")
          echo "Rollback proxy response: $CURL_OUT3"
          if [ "$CURL_OUT3" != "proxied:/rollback-test" ]; then
            echo "ERROR: tunneled request failed after rollback"
            exit 1
          fi

          echo "All upgrade and rollback checks passed"
      - name: Stop container
        if: always()
        run: docker stop tunnel-server-test || true

  installer:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:client
      - name: Start server
        run: |
          TUNNEL_USERNAME=admin TUNNEL_PASSWORD=secret \
          INSTALL_UUID=ci-install \
          SERVER_HOST=http://127.0.0.1:7860 \
          node src/index.js &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server.pid
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://127.0.0.1:7860/__health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 0.5
          done
          curl -fsS --max-time 5 http://127.0.0.1:7860/__health || exit 1
      - name: Verify artifact routes
        run: |
          curl -sf --max-time 10 http://127.0.0.1:7860/client.js -o /tmp/client.js
          node --check /tmp/client.js
          curl -sf --max-time 10 http://127.0.0.1:7860/client-package.json -o /tmp/pkg.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('/tmp/pkg.json','utf8'));
            console.log('Manifest:', p.name);
          "
      - name: Run installer
        run: |
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX" \
          TUNNEL_SERVER_URL=ws://127.0.0.1:7860/tunnel \
          TUNNEL_USERNAME=admin \
          TUNNEL_PASSWORD=secret \
          TARGET_ORIGIN=http://127.0.0.1:8080 \
            bash serve/setup.sh 2>&1
          ls -la "$SANDBOX/.tunnel-client/"
      - name: Verify client connects
        run: |
          node -e "
            const { WebSocket } = require('ws');
            const ws = new WebSocket('ws://admin:secret@127.0.0.1:7860/tunnel');
            ws.on('open', () => { console.log('CLIENT CONNECTED'); ws.close(); process.exit(0); });
            ws.on('error', (e) => { console.error('CONNECT ERROR:', e.message); process.exit(1); });
            setTimeout(() => { console.error('TIMEOUT'); process.exit(1); }, 5000);
          "
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
